<header class="site-nav-wrapper">

    <div class="site-nav">

        <!-- BRAND -->

        <a href="/" class="site-brand">

            <span class="brand-icon">
                Y
            </span>

            <span class="brand-name">
                Your Website
            </span>

        </a>


        <!-- DESKTOP MENU -->

        <nav class="site-menu" id="siteMenu">

            <a href="/" class="nav-link">
                Home
            </a>

            <a href="/pages/about.html" class="nav-link">
                About
            </a>

            <a href="/pages/resources.html" class="nav-link">
                Resources
            </a>

            <a href="/pages/articles.html" class="nav-link">
                Articles
            </a>

            <a href="/pages/contact.html" class="nav-link">
                Contact
            </a>

        </nav>


        <!-- RIGHT CONTROLS -->

        <div class="nav-controls">


            <!-- SEARCH -->

            <button
                class="nav-control search-trigger"
                type="button"
                aria-label="Search website">

                <span class="control-icon">
                    ⌕
                </span>

                <span class="search-label">
                    Search
                </span>

                <span class="keyboard-shortcut">
                    ⌘K
                </span>

            </button>


            <!-- APPEARANCE -->

            <div class="appearance-container">

                <button
                    class="nav-control theme-trigger"
                    type="button"
                    id="globalThemeButton"
                    aria-label="Change appearance"
                    aria-expanded="false">

                    <span
                        id="globalThemeIcon">
                        ◐
                    </span>

                </button>


                <!-- APPEARANCE POPOVER -->

                <div
                    class="appearance-popover"
                    id="appearancePopover">


                    <div class="appearance-header">

                        <div class="appearance-title">
                            Appearance
                        </div>

                        <div class="appearance-description">
                            Choose how this website looks
                        </div>

                    </div>


                    <div class="appearance-options">


                        <!-- LIGHT -->

                        <button
                            class="appearance-option"
                            data-theme-choice="light">

                            <div class="appearance-preview light-preview">

                                <div class="preview-window">

                                    <div class="preview-toolbar">
                                    </div>

                                    <div class="preview-content">

                                        <span></span>
                                        <span></span>
                                        <span></span>

                                    </div>

                                </div>

                            </div>


                            <div class="appearance-option-name">

                                <span>
                                    Light
                                </span>

                                <span
                                    class="appearance-check">
                                    ✓
                                </span>

                            </div>

                        </button>



                        <!-- SYSTEM -->

                        <button
                            class="appearance-option"
                            data-theme-choice="system">

                            <div class="appearance-preview system-preview">

                                <div class="preview-window">

                                    <div class="preview-toolbar">
                                    </div>

                                    <div class="preview-content">

                                        <span></span>
                                        <span></span>
                                        <span></span>

                                    </div>

                                </div>

                            </div>


                            <div class="appearance-option-name">

                                <span>
                                    System
                                </span>

                                <span
                                    class="appearance-check">
                                    ✓
                                </span>

                            </div>

                        </button>



                        <!-- DARK -->

                        <button
                            class="appearance-option"
                            data-theme-choice="dark">

                            <div class="appearance-preview dark-preview">

                                <div class="preview-window">

                                    <div class="preview-toolbar">
                                    </div>

                                    <div class="preview-content">

                                        <span></span>
                                        <span></span>
                                        <span></span>

                                    </div>

                                </div>

                            </div>


                            <div class="appearance-option-name">

                                <span>
                                    Dark
                                </span>

                                <span
                                    class="appearance-check">
                                    ✓
                                </span>

                            </div>

                        </button>


                    </div>


                    <div class="appearance-footer">

                        <span>
                            Current appearance:
                        </span>

                        <strong
                            id="currentAppearanceLabel">
                            System
                        </strong>

                    </div>

                </div>

            </div>


            <!-- MOBILE -->

            <button
                class="nav-control mobile-trigger"
                type="button"
                id="mobileMenuButton"
                aria-label="Open navigation">

                <span class="hamburger">

                    <span></span>
                    <span></span>
                    <span></span>

                </span>

            </button>

        </div>

    </div>


    <!-- MOBILE NAVIGATION -->

    <div
        class="mobile-navigation"
        id="mobileNavigation">

        <a href="/">
            Home
        </a>

        <a href="/pages/about.html">
            About
        </a>

        <a href="/pages/resources.html">
            Resources
        </a>

        <a href="/pages/articles.html">
            Articles
        </a>

        <a href="/pages/contact.html">
            Contact
        </a>

        <button class="mobile-search-trigger">
            ⌕ &nbsp; Search
        </button>

    </div>

</header>
