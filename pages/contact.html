<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Contact Your Website."><title>Contact — Your Website</title><link rel="stylesheet" href="../assets/css/global.css"></head><body data-page="pages/contact.html"><div class="page-shell"><div id="global-header"></div><main><section class="page-hero compact"><p class="eyebrow">Contact</p><h1>Start a<br><em>conversation.</em></h1><p class="lede">Have a question, an idea, or something to share? Use the form below.</p></section><section class="contact-layout"><div class="contact-aside"><p class="eyebrow">Get in touch</p><h2>We’d like to hear what’s on your mind.</h2><p>This form is ready for a future form service or backend integration. Until then, it provides a polished local confirmation only.</p></div><form class="contact-form glass-panel" data-contact-form novalidate><div class="form-row"><div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required><span class="field-error"></span></div><div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><span class="field-error"></span></div></div><div><label for="subject">Subject</label><input id="subject" name="subject" required><span class="field-error"></span></div><div><label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea><span class="field-error"></span></div><button class="button button-primary" type="submit">Submit message <span>→</span></button><p class="form-status" data-form-status role="status" aria-live="polite"></p></form></section></main><div id="global-footer"></div></div><script src="../assets/js/layout.js" defer></script></body></html>
